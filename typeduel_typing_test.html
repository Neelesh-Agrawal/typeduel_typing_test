<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2c"><meta name="description" content="Type to race. An endless hydrofoil chase through a storm. Keep typing, keep up with the pace boat, go further."><title>WAKE — Typeduel</title><link rel="stylesheet" href="wake.css?v=meta-1"></head><body>
<canvas id="sea" aria-label="Hydrofoil racing through a storm-lit tidal course"></canvas>
<header><a class="brand" href="./">typeduel<span>WAKE</span></a><nav aria-label="Game settings"><button id="quality" aria-pressed="false">Effects: full</button><button id="sound" aria-pressed="true">Sound: on</button><button id="pause" hidden>Pause</button></nav></header><main>
<section id="intro" class="panel intro"><h1>Chase the<br>last light.</h1><p>Type to fly. Keep up with the pace boat.<br>It never slows down.</p><button id="start" class="primary">Play <span aria-hidden="true">↗</span></button><p class="best" id="best"></p></section><div id="meta-menu"></div>
<section id="hud" hidden aria-label="Race telemetry"><div><b id="distance">0 m</b><div id="perks"></div></div><div><b id="wpm">0</b><span>WPM</span></div><div id="gap" class="gap"><p id="lead">Side by side</p><div class="gap-track"><i id="gap-fill"></i></div></div></section>
<section id="typing" hidden><div id="passage" aria-label="Phrase to type"></div><label class="sr-only" for="input">Type the phrase exactly as shown</label><input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…"></section>
<section id="result" class="panel result" hidden><h2 id="result-title">Lost the light.</h2><p id="result-copy" class="big"></p><div id="meta-result"></div><div class="result-stats"><div><b id="final-wpm">0</b><span>WPM</span></div><div><b id="final-accuracy">0%</b><span>accuracy</span></div><div><b id="final-distance">0</b><span>best clean chain</span></div></div><button id="replay" class="primary">Play again <span aria-hidden="true">↗</span></button><button id="share">Copy result</button><button id="menu" hidden>Menu</button><p id="share-status" role="status"></p></section>
<section id="paused" class="pause-panel" hidden><h2>Paused</h2><button id="resume" class="primary">Resume</button><button id="quit">End run</button></section>
<section id="error" class="panel" hidden><h2>The sea couldn’t load.</h2><p>Enable hardware acceleration or try a browser with WebGL support, then reload.</p><button onclick="location.reload()">Reload game</button></section><button id="camera-view" hidden aria-pressed="false">View: chase</button><button id="boost" hidden><span id="boost-label">BOOST 0%</span><i><b id="boost-fill"></b></i></button><div id="notice" role="status"></div><span id="rival-label" hidden>PACE BOAT</span></main><div id="announcement" class="sr-only" role="status" aria-live="polite"></div><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="wake.mjs?v=meta-1"></script></body></html>
