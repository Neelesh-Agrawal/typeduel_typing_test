
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  #td-root{background:#0a0a0a;min-height:520px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;font-family:'Space Mono',monospace;position:relative;overflow:hidden}
  #td-root::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,#1a1200 0%,#0a0a0a 70%);pointer-events:none}
  .td-screen{width:100%;max-width:640px;position:relative;z-index:1}
  .td-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
  .td-logo{font-family:'DM Serif Display',serif;font-size:18px;color:#333;letter-spacing:0.05em;font-style:italic}
  .td-stats{display:flex;gap:2rem}
  .td-stat{text-align:right}
  .td-stat-val{font-size:20px;font-weight:700;color:#e8a020;font-family:'Space Mono',monospace;line-height:1}
  .td-stat-label{font-size:10px;color:#333;letter-spacing:0.12em;text-transform:uppercase;margin-top:3px}
  .td-quote-area{position:relative;margin-bottom:2rem}
  .td-quote-source{font-size:10px;color:#2a2a2a;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:1rem}
  .td-text{font-family:'Space Mono',monospace;font-size:16px;line-height:1.9;color:#2a2a2a;word-break:break-word;letter-spacing:0.02em}
  .td-char{position:relative;transition:color 0.05s}
  .td-char.correct{color:#e8a020}
  .td-char.wrong{color:#c0392b;text-decoration:underline;text-decoration-color:#c0392b88}
  .td-char.cursor::after{content:'';position:absolute;left:0;bottom:1px;width:100%;height:1px;background:#e8a020;animation:blink 1s step-end infinite}
  .td-char.cursor.pending{color:#555}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .td-input-wrap{position:relative}
  .td-input{width:100%;background:transparent;border:none;border-bottom:1px solid #1a1a1a;color:transparent;caret-color:transparent;font-family:'Space Mono',monospace;font-size:16px;padding:0.75rem 0;outline:none;resize:none;height:48px}
  .td-hint{font-size:11px;color:#222;letter-spacing:0.08em;margin-top:1rem;text-align:center}
  .td-progress{width:100%;height:1px;background:#111;margin-bottom:2.5rem;position:relative}
  .td-progress-fill{height:100%;background:#e8a020;transition:width 0.1s;width:0%}

  .td-result{display:none;flex-direction:column;align-items:center;gap:1.5rem}
  .td-result.show{display:flex}
  .td-grade-ring{width:100px;height:100px;border-radius:50%;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;position:relative}
  .td-grade{font-family:'DM Serif Display',serif;font-size:52px;color:#e8a020;font-style:italic;line-height:1}
  .td-result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;width:100%;background:#111}
  .td-result-stat{background:#0a0a0a;padding:1.25rem;text-align:center}
  .td-result-val{font-size:28px;font-weight:700;color:#e8a020;display:block;line-height:1}
  .td-result-label{font-size:9px;color:#333;letter-spacing:0.15em;text-transform:uppercase;margin-top:6px;display:block}
  .td-result-quote{font-size:11px;color:#222;text-align:center;font-style:italic;line-height:1.6;max-width:400px;border-top:1px solid #111;padding-top:1.5rem;width:100%}
  .td-result-quote span{color:#333}
  .td-actions{display:flex;gap:1rem}
  .td-btn{background:transparent;border:1px solid #1a1a1a;color:#333;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;padding:10px 20px;cursor:pointer;text-transform:uppercase;transition:all 0.15s}
  .td-btn:hover{border-color:#e8a020;color:#e8a020}
  .td-btn.primary{border-color:#e8a020;color:#e8a020}
  .td-btn.primary:hover{background:#e8a020;color:#0a0a0a}
  .td-share-msg{font-size:10px;color:#e8a020;letter-spacing:0.08em;opacity:0;transition:opacity 0.3s;text-align:center}
  .td-share-msg.show{opacity:1}
  .td-typing-area{display:block}
  .td-idle-hint{font-size:11px;color:#222;letter-spacing:0.08em;text-align:center;margin-top:1.5rem;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
</style>

<div id="td-root" role="main">
  <div class="td-screen">
    <div class="td-header">
      <div class="td-logo">typeduel</div>
      <div class="td-stats">
        <div class="td-stat"><div class="td-stat-val" id="td-wpm">—</div><div class="td-stat-label">wpm</div></div>
        <div class="td-stat"><div class="td-stat-val" id="td-acc">—</div><div class="td-stat-label">acc</div></div>
        <div class="td-stat"><div class="td-stat-val" id="td-time">0.0</div><div class="td-stat-label">sec</div></div>
      </div>
    </div>

    <div class="td-progress"><div class="td-progress-fill" id="td-bar"></div></div>

    <div id="td-typing-area" class="td-typing-area">
      <div class="td-quote-area">
        <div class="td-quote-source" id="td-source"></div>
        <div class="td-text" id="td-text-display"></div>
      </div>
      <div class="td-input-wrap">
        <textarea id="td-input" class="td-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" rows="1"></textarea>
        <div class="td-idle-hint" id="td-idle">click anywhere and start typing</div>
      </div>
    </div>

    <div id="td-result" class="td-result">
      <div class="td-grade-ring"><div class="td-grade" id="td-grade-letter">A</div></div>
      <div class="td-result-stats">
        <div class="td-result-stat"><span class="td-result-val" id="r-wpm">0</span><span class="td-result-label">words / min</span></div>
        <div class="td-result-stat"><span class="td-result-val" id="r-acc">0%</span><span class="td-result-label">accuracy</span></div>
        <div class="td-result-stat"><span class="td-result-val" id="r-time">0s</span><span class="td-result-label">time</span></div>
      </div>
      <div class="td-result-quote"><span id="r-quote-text"></span><br><span id="r-quote-src"></span></div>
      <div class="td-actions">
        <button class="td-btn" id="td-share-btn">share result</button>
        <button class="td-btn primary" id="td-retry-btn">next quote →</button>
      </div>
      <div class="td-share-msg" id="td-share-msg">result copied to clipboard</div>
    </div>
  </div>
</div>

<script>
const QUOTES=[
  {text:"The details are not the details. They make the design.",source:"Charles Eames"},
  {text:"Design is not just what it looks like and feels like. Design is how it works.",source:"Steve Jobs"},
  {text:"Simplicity is the ultimate sophistication.",source:"Leonardo da Vinci"},
  {text:"Have nothing in your houses that you do not know to be useful or believe to be beautiful.",source:"William Morris"},
  {text:"The object of art is to give life a shape.",source:"Jean Anouilh"},
  {text:"We are what we repeatedly do. Excellence, then, is not an act but a habit.",source:"Aristotle"},
  {text:"You have power over your mind, not outside events. Realize this, and you will find strength.",source:"Marcus Aurelius"},
  {text:"The impediment to action advances action. What stands in the way becomes the way.",source:"Marcus Aurelius"},
  {text:"It is not that I'm so smart. But I stay with the questions much longer.",source:"Albert Einstein"},
  {text:"The most courageous act is still to think for yourself. Aloud.",source:"Coco Chanel"},
  {text:"Form ever follows function.",source:"Louis Sullivan"},
  {text:"Good design is as little design as possible.",source:"Dieter Rams"},
  {text:"A designer knows he has achieved perfection not when there is nothing left to add, but when there is nothing left to take away.",source:"Antoine de Saint-Exupéry"},
  {text:"Everything is designed. Few things are designed well.",source:"Brian Reed"},
  {text:"One must always draw, distrust what one does and never be satisfied.",source:"Edgar Degas"},
];

let current=null,typed='',startTime=null,timerInterval=null,elapsed=0,started=false,finished=false,lastIdx=0;

function pickQuote(){
  let q;do{q=QUOTES[Math.floor(Math.random()*QUOTES.length)]}while(q===current);
  return current=q;
}

function renderText(){
  const display=document.getElementById('td-text-display');
  const chars=current.text.split('');
  display.innerHTML=chars.map((c,i)=>{
    let cls='td-char';
    if(i<typed.length){cls+=typed[i]===c?' correct':' wrong';}
    if(i===typed.length)cls+=' cursor pending';
    return`<span class="${cls}" data-i="${i}">${c==' '?'&nbsp;':c}</span>`;
  }).join('');
}

function calcWPM(){
  if(!startTime)return 0;
  const mins=elapsed/60;
  if(mins<0.01)return 0;
  const words=typed.trim().split(/\s+/).filter(Boolean).length;
  return Math.round(words/mins)||0;
}

function calcAcc(){
  if(!typed.length)return 100;
  let correct=0;
  for(let i=0;i<typed.length;i++){if(typed[i]===current.text[i])correct++;}
  return Math.round((correct/typed.length)*100);
}

function updateStats(){
  const wpm=calcWPM();
  const acc=calcAcc();
  document.getElementById('td-wpm').textContent=started?wpm:'—';
  document.getElementById('td-acc').textContent=started?acc+'%':'—';
  const pct=typed.length/current.text.length*100;
  document.getElementById('td-bar').style.width=Math.min(pct,100)+'%';
}

function getGrade(wpm,acc){
  const score=(wpm*0.6)+(acc*0.4);
  if(acc<70)return'F';
  if(score>=110)return'S';
  if(score>=90)return'A';
  if(score>=70)return'B';
  if(score>=55)return'C';
  if(score>=40)return'D';
  return'F';
}

function showResult(){
  finished=true;
  clearInterval(timerInterval);
  const wpm=calcWPM();
  const acc=calcAcc();
  const grade=getGrade(wpm,acc);
  document.getElementById('td-typing-area').style.display='none';
  document.getElementById('td-result').classList.add('show');
  document.getElementById('td-grade-letter').textContent=grade;
  document.getElementById('r-wpm').textContent=wpm;
  document.getElementById('r-acc').textContent=acc+'%';
  document.getElementById('r-time').textContent=elapsed.toFixed(1)+'s';
  document.getElementById('r-quote-text').textContent='"'+current.text+'"';
  document.getElementById('r-quote-src').textContent='— '+current.source;
  document.getElementById('td-bar').style.width='100%';
}

function startTimer(){
  startTime=Date.now();
  timerInterval=setInterval(()=>{
    elapsed=(Date.now()-startTime)/1000;
    document.getElementById('td-time').textContent=elapsed.toFixed(1);
    updateStats();
  },100);
}

function reset(){
  clearInterval(timerInterval);
  typed='';started=false;finished=false;elapsed=0;startTime=null;
  document.getElementById('td-wpm').textContent='—';
  document.getElementById('td-acc').textContent='—';
  document.getElementById('td-time').textContent='0.0';
  document.getElementById('td-bar').style.width='0%';
  document.getElementById('td-input').value='';
  document.getElementById('td-result').classList.remove('show');
  document.getElementById('td-typing-area').style.display='block';
  document.getElementById('td-idle').style.display='block';
  pickQuote();
  document.getElementById('td-source').textContent='— '+current.source;
  renderText();
  document.getElementById('td-input').focus();
}

document.getElementById('td-input').addEventListener('input',function(e){
  if(finished)return;
  const val=this.value;
  if(!started&&val.length>0){
    started=true;
    document.getElementById('td-idle').style.display='none';
    startTimer();
  }
  typed=val;
  renderText();
  updateStats();
  if(typed.length>=current.text.length){
    const correct=Array.from(typed).every((c,i)=>c===current.text[i]);
    if(typed.length===current.text.length)showResult();
  }
});

document.getElementById('td-input').addEventListener('keydown',function(e){
  if(e.key==='Escape')reset();
});

document.getElementById('td-root').addEventListener('click',function(){
  if(!finished)document.getElementById('td-input').focus();
});

document.getElementById('td-retry-btn').addEventListener('click',reset);

document.getElementById('td-share-btn').addEventListener('click',function(){
  const wpm=document.getElementById('r-wpm').textContent;
  const acc=document.getElementById('r-acc').textContent;
  const grade=document.getElementById('td-grade-letter').textContent;
  const msg=`typeduel result\n${grade} — ${wpm} wpm · ${acc} acc\n"${current.text}"\n— ${current.source}`;
  navigator.clipboard.writeText(msg).then(()=>{
    const el=document.getElementById('td-share-msg');
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),2500);
  });
});

document.getElementById('td-source').textContent='— '+(current||pickQuote()).source;
pickQuote();
document.getElementById('td-source').textContent='— '+current.source;
renderText();
document.getElementById('td-input').focus();
</script>
